name: Protocol model tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  reference-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run reference model tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Run finite structural model check
        env:
          PYTHONPATH: .
        run: python scripts/run_formal_model_check.py
      - name: Run deterministic offboarding experiment
        env:
          PYTHONPATH: .
        run: python scripts/run_offboarding_experiment.py
      - name: Run deterministic delegation frontier
        env:
          PYTHONPATH: .
        run: python scripts/run_delegation_frontier.py
      - name: Run adaptive delegation capability sweep
        env:
          PYTHONPATH: .
        run: python scripts/run_delegation_study.py

  aios-compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: pinned
            aios_ref: 0ba9c36bd8168ae1346770e6430474662b30e196
          - label: current-aios-main
            aios_ref: main
    steps:
      - name: Checkout BAA-Protocol
        uses: actions/checkout@v4
        with:
          path: baa
      - name: Checkout pinned AIOS
        uses: actions/checkout@v4
        with:
          repository: xiongweilin/aios
          ref: ${{ matrix.aios_ref }}
          path: aios
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Record exact cross-repository heads
        run: |
          git -C baa rev-parse HEAD
          git -C aios rev-parse HEAD
      - name: Install checked-out AIOS
        run: python -m pip install -e ./aios
      - name: Check AIOS policy surface
        env:
          PYTHONPATH: baa:aios
        run: python -m unittest discover -s baa/integration -p "test_*.py" -k test_01 -v
      - name: Check AIOS obligation projection
        env:
          PYTHONPATH: baa:aios
        run: python -m unittest discover -s baa/integration -p "test_*.py" -k test_02 -v
      - name: Check AIOS postconditions
        env:
          PYTHONPATH: baa:aios
        run: python -m unittest discover -s baa/integration -p "test_*.py" -k test_03 -v
      - name: Check AIOS runtime capabilities
        env:
          PYTHONPATH: baa:aios
        run: python -m unittest discover -s baa/integration -p "test_*.py" -k test_04 -v
      - name: Check BAA execution on AIOS obligations
        env:
          PYTHONPATH: baa:aios
        run: python -m unittest discover -s baa/integration -p "test_*.py" -k test_05 -v
      - name: Check BAA gate in real AIOS offboarding engine
        env:
          PYTHONPATH: baa:aios
        run: python -m unittest discover -s baa/integration -p "test_aios_runtime_gate.py" -v
      - name: Check pinned World Runtime enforcement surface
        env:
          PYTHONPATH: baa:aios
        run: python -m unittest discover -s baa/integration -p "test_aios_world_runtime_surface.py" -v
      - name: Check pinned Runtime mediation surface
        env:
          PYTHONPATH: baa:aios
        run: python -m unittest discover -s baa/integration -p "test_aios_runtime_mediation_surface.py" -v
      - name: Check pinned product connector refinement
        env:
          PYTHONPATH: baa:aios
        run: python -m unittest discover -s baa/integration -p "test_aios_product_connector_refinement.py" -v
      - name: Check AIOS canary release contract
        env:
          PYTHONPATH: baa:aios
        run: python -m unittest discover -s baa/integration -p "test_aios_canary_release_contract.py" -v
      - name: Check canary unknown-effect reconciliation
        env:
          PYTHONPATH: baa:aios
        run: python -m unittest discover -s baa/integration -p "test_aios_canary_runtime_reconciliation.py" -v
