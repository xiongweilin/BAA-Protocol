name: Protocol model tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  reference-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run reference model tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Run deterministic offboarding experiment
        env:
          PYTHONPATH: .
        run: python scripts/run_offboarding_experiment.py

  aios-compatibility:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout BAA-Protocol
        uses: actions/checkout@v4
        with:
          path: baa
      - name: Checkout pinned AIOS
        uses: actions/checkout@v4
        with:
          repository: xiongweilin/aios
          ref: f5afd2721e04ab4b9e14c4aecd0e6bc688828783
          path: aios
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned AIOS
        run: python -m pip install -e ./aios
      - name: Check AIOS policy surface
        env:
          PYTHONPATH: baa:aios
        run: python -m unittest discover -s baa/integration -p "test_*.py" -k test_01 -v
      - name: Check AIOS obligation projection
        env:
          PYTHONPATH: baa:aios
        run: python -m unittest discover -s baa/integration -p "test_*.py" -k test_02 -v
      - name: Check AIOS postconditions
        env:
          PYTHONPATH: baa:aios
        run: python -m unittest discover -s baa/integration -p "test_*.py" -k test_03 -v
      - name: Check AIOS runtime capabilities
        env:
          PYTHONPATH: baa:aios
        run: python -m unittest discover -s baa/integration -p "test_*.py" -k test_04 -v
      - name: Check BAA execution on AIOS obligations
        env:
          PYTHONPATH: baa:aios
        run: python -m unittest discover -s baa/integration -p "test_*.py" -k test_05 -v
      - name: Check BAA gate in real AIOS offboarding engine
        env:
          PYTHONPATH: baa:aios
        run: python -m unittest discover -s baa/integration -p "test_aios_runtime_gate.py" -v
      - name: Check pinned World Runtime enforcement surface
        env:
          PYTHONPATH: baa:aios
        run: python -m unittest discover -s baa/integration -p "test_aios_world_runtime_surface.py" -v
